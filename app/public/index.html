
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan EMI Calculator - Version 1.1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background: #f3f5f9;
            font-family: Arial, sans-serif;
        }

        .main-card {
            max-width: 900px;
            margin: 45px auto;
            border: none;
            border-radius: 15px;
        }

        .header {
            background: #172554;
            color: white;
            padding: 25px;
            border-radius: 15px 15px 0 0;
        }

        .result-box {
            background: #eff6ff;
            border-left: 5px solid #2563eb;
            padding: 20px;
            border-radius: 8px;
        }

        .result-value {
            color: #1d4ed8;
            font-size: 25px;
            font-weight: bold;
        }

        .table-responsive {
            overflow-x: auto;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card main-card shadow">

        <div class="header">
            <h2>Loan EMI Calculator</h2>
            <p class="mb-0">Calculate your monthly loan instalments</p>
        </div>

        <div class="card-body p-4">

            <h5 class="mb-3">Loan Details</h5>

            <form id="emiForm">

                <div class="mb-3">
                    <label class="form-label">Loan Amount (PKR)</label>
                    <input type="number" class="form-control"
                           id="principal" min="0.01" step="any"
                           placeholder="Enter loan amount" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Annual Interest Rate (%)</label>
                    <input type="number" class="form-control"
                           id="rate" min="0.01" step="any"
                           placeholder="Enter annual interest rate" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tenure (Months)</label>
                    <input type="number" class="form-control"
                           id="months" min="1" step="1"
                           placeholder="Enter tenure in months" required>
                </div>

                <button type="submit" class="btn btn-primary w-100"
                        id="calculateBtn">
                    Calculate EMI
                </button>

            </form>

            <div id="errorMessage" class="alert alert-danger mt-3"
                 style="display:none;"></div>

            <div id="resultPanel" class="mt-4" style="display:none;">

                <h5 class="mb-3">Calculation Result</h5>

                <div class="result-box">

                    <p>Monthly EMI</p>
                    <div class="result-value" id="emi"></div>

                    <hr>

                    <p>Total Payment:
                        <strong id="totalPayment"></strong>
                    </p>

                    <p>Total Interest:
                        <strong id="totalInterest"></strong>
                    </p>

                    <p class="mb-0">Served By:
                        <strong id="servedBy"></strong>
                    </p>

                    <p class="mb-0">Pod IP:
                        <strong id="servedByIP"></strong>
                    </p>

                </div>
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Calculation History</h5>
                <button class="btn btn-outline-primary btn-sm"
                        id="refreshHistory">
                    Refresh
                </button>
            </div>

            <div class="table-responsive">

                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Principal</th>
                            <th>Rate (%)</th>
                            <th>Months</th>
                            <th>EMI</th>
                            <th>Served By</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="historyTable">
                        <tr>
                            <td colspan="6" class="text-center">
                                Loading history...
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </div>
    </div>
</div>

<script>

    function formatPKR(value) {
        return "PKR " + Number(value).toLocaleString("en-PK", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    // AJAX EMI calculation
    $("#emiForm").on("submit", function(event) {

        event.preventDefault();

        const P = Number($("#principal").val());
        const rate = Number($("#rate").val());
        const n = Number($("#months").val());

        if (
            !Number.isFinite(P) ||
            !Number.isFinite(rate) ||
            !Number.isSafeInteger(n) ||
            P <= 0 || rate <= 0 || n <= 0
        ) {
            $("#errorMessage")
                .text("Please enter positive valid numbers. Tenure must be a whole number.")
                .show();

            return;
        }

        $("#errorMessage").hide();
        $("#calculateBtn").prop("disabled", true).text("Calculating...");

        $.ajax({
            url: "/api/emi",
            method: "POST",
            contentType: "application/json",

            data: JSON.stringify({ P, rate, n }),

            success: function(data) {

                $("#emi").text(formatPKR(data.emi));

                $("#totalPayment").text(formatPKR(data.totalPayment));

                $("#totalInterest").text(formatPKR(data.totalInterest));

                $("#servedBy").text(data.servedBy);

                $("#servedByIP").text(data.servedByIP);

                $("#resultPanel").show();

                loadHistory();
            },

            error: function(xhr) {
                const message = xhr.responseJSON?.error || "Something went wrong";

                $("#errorMessage").text(message).show();
            },

            complete: function() {
                $("#calculateBtn").prop("disabled", false)
                    .text("Calculate EMI");
            }
        });

    });

    // AJAX history retrieval
    function loadHistory() {

        $.ajax({
            url: "/api/history",
            method: "GET",

            success: function(records) {

                $("#historyTable").empty();

                if (records.length === 0) {
                    $("#historyTable").html(
                        '<tr><td colspan="6" class="text-center">No calculations yet</td></tr>'
                    );
                    return;
                }

                records.forEach(function(record) {

                    const date = new Date(record.createdAt)
                        .toLocaleString();

                    const row = $("<tr>");

                    [
                        formatPKR(record.principal),
                        record.rate,
                        record.months,
                        formatPKR(record.emi),
                        record.servedBy,
                        date
                    ].forEach(function(value) {
                        $("<td>").text(value).appendTo(row);
                    });

                    $("#historyTable").append(row);
                });

            },

            error: function() {
                $("#historyTable").html(
                    '<tr><td colspan="6" class="text-center">Unable to load history</td></tr>'
                );
            }
        });
    }

    $("#refreshHistory").on("click", loadHistory);

    // Load history when the page opens
    $(document).ready(loadHistory);

</script>

    <footer class="text-center text-muted py-3">
        Updated Version 1.1 | Kubernetes Rolling Update Demo
    </footer>
</body>
</html>
